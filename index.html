<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Small browser toys and experiments by Bogdan Deaky." />
  <title>mini-projects — Bogdan Deaky</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: #f4f0ff;
      background: radial-gradient(circle at top, #2a1f4d 0%, #120b22 45%, #090611 100%);
    }
    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 48px 20px 64px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 2.2rem;
    }
    .sub {
      margin: 0 0 32px;
      color: #b9aed8;
      line-height: 1.5;
    }
    .grid {
      display: grid;
      gap: 16px;
    }
    .card {
      display: block;
      padding: 20px 22px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: inherit;
      text-decoration: none;
      transition: transform 0.12s ease, border-color 0.12s ease, background 0.12s ease;
    }
    .card:hover {
      transform: translateY(-2px);
      border-color: rgba(167, 137, 255, 0.45);
      background: rgba(132, 94, 255, 0.12);
    }
    .card h2 {
      margin: 0 0 6px;
      font-size: 1.25rem;
    }
    .card p {
      margin: 0;
      color: #d8d0ef;
      line-height: 1.45;
    }
    .tag {
      display: inline-block;
      margin-top: 12px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(125, 255, 178, 0.12);
      color: #7dffb2;
      font-size: 0.82rem;
      font-weight: 700;
    }
    footer {
      margin-top: 40px;
      color: #7a7194;
      font-size: 0.86rem;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>mini-projects</h1>
    <p class="sub">Small browser toys. Pick one. No install.</p>

    <div class="grid">
      <a class="card" href="./tiny-chaos-factory/">
        <h2>Tiny Chaos Factory</h2>
        <p>A small browser toy about machines, constraints, chaos, and soup.</p>
        <span class="tag">Play →</span>
      </a>
    </div>

    <footer>Made by Bogdan Deaky</footer>
  </div>
</body>
</html>
